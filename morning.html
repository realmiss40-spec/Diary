<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Morning Pages"><meta name="theme-color" content="#fcfbf9"><title>Morning Pages</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"><style>
/* Layout: one paper card like Diary Book, folder tabs below, a calendar-sticker date block above a 14-line ruled sheet. */
:root{
  --bg:#e6e4e0;--paper:#fcfbf9;--ink:#181818;--mut:#8f8c87;--faint:#dcd9d3;--soft:#f1efeb;
  --red:#b4493c;--blue:#3b62a8;--shadow:rgba(0,0,0,.16);
  --stk:#f6f4ef;--stk-tab:#cdcbc6;--stk-pin:#4a4a48;--stk-ink:#1b1b1b;--stk-red:#b4493c;--stk-blue:#3b62a8;
  --serif:'Playfair Display','Didot','Bodoni 72',Georgia,serif;
  --sans:"Avenir Next","SF Pro Text",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#050505;--paper:#161616;--ink:#ecebe8;--mut:#7f7d79;--faint:#333230;--soft:#202020;--red:#e07a6c;--blue:#8aa9e6;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050505;--paper:#161616;--ink:#ecebe8;--mut:#7f7d79;--faint:#333230;--soft:#202020;--red:#e07a6c;--blue:#8aa9e6;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,textarea{font:inherit;color:inherit;border:0;background:transparent;outline:0;border-radius:0;width:100%;-webkit-appearance:none;appearance:none}
textarea{resize:none;display:block}
#app{width:100%;max-width:440px;height:100%;max-height:920px;align-self:center;display:flex;flex-direction:column;background:var(--paper);border-radius:28px;box-shadow:0 10px 30px var(--shadow);overflow:hidden;position:relative}
@media(min-width:620px){#app{max-width:640px}}
#hd{display:flex;align-items:center;gap:8px;padding:14px 18px 8px;flex:none}
#hd .t{flex:1;font-size:15px;font-weight:500;letter-spacing:-.01em}
#ring{width:32px;height:32px;display:grid;place-items:center;color:var(--mut)}
#ring.ping circle.o{animation:pg .9s ease}
@keyframes pg{0%{stroke:var(--ink);stroke-width:3}100%{stroke:currentColor;stroke-width:1.6}}
@media(prefers-reduced-motion:reduce){#ring.ping circle.o{animation:none}}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 18px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#tabs{display:flex;align-items:flex-start;overflow-x:auto;background:var(--paper);scrollbar-width:none;flex:none;padding:0 14px 10px;gap:3px}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:1 0 auto;text-align:center;margin-top:-1px;padding:8px 13px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);background:var(--soft);border:1px solid var(--faint);border-top:0;border-radius:0 0 11px 11px;box-shadow:0 3px 5px -1px var(--shadow);transition:padding .15s}
#tabs button.on{background:var(--paper);color:var(--ink);font-weight:600;padding-bottom:13px;box-shadow:0 4px 7px -1px var(--shadow)}
.lb{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:500}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-top:6px;flex-wrap:wrap}
h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
h1 small{font-size:12px;font-weight:500;color:var(--mut);margin-left:8px;letter-spacing:.06em}
.pn{display:flex;gap:8px;align-items:center;font-size:9.5px;letter-spacing:.1em;color:var(--mut);flex:none}
.pn button{padding:8px 0;color:var(--mut)}
.pn button.tdy{color:var(--ink);font-weight:600}
.pn i{width:1px;height:9px;background:var(--faint)}
.rule{border:0;border-top:1.5px solid var(--ink);margin:6px 0 12px}
.emp{color:var(--mut);font-size:12px;padding:8px 0}
.note{color:var(--mut);font-size:11px;margin:8px 0}
.btn{display:inline-block;border:1px solid var(--ink);padding:9px 16px;font-size:12px;letter-spacing:.04em;text-align:center}
.btn.blk{background:var(--ink);color:var(--paper)}
.btn.sm{padding:6px 12px;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
.chip{border:1px solid var(--faint);padding:4px 11px;font-size:12px;border-radius:99px;white-space:nowrap}
.chip small{color:var(--mut);margin-left:5px;font-size:10px}
.seg{display:flex;border:1px solid var(--ink);width:fit-content}
.seg button{padding:6px 16px;font-size:11.5px}
.seg button.on{background:var(--ink);color:var(--paper)}
/* today */
.top{display:flex;gap:16px;align-items:stretch;padding:10px 0 14px}
.stkw{flex:none;width:116px}
.stkw small{display:block;margin-top:9px;font-size:9px;color:var(--mut);line-height:1.35}
.stk{display:block;width:116px;background:var(--stk);color:var(--stk-ink);box-shadow:0 1px 0 rgba(0,0,0,.05),0 6px 14px var(--shadow);text-align:center;font-family:var(--serif);font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.stk span{display:block}
.stk .tab{height:15px;background:var(--stk-tab);position:relative}
.stk .tab::before,.stk .tab::after{content:"";position:absolute;top:5px;width:5px;height:5px;border-radius:50%;background:var(--stk-pin)}
.stk .tab::before{left:15px}.stk .tab::after{right:15px}
.stk .bd{display:flex;flex-direction:column;align-items:center;gap:11px;padding:15px 2px 16px}
.stk .m,.stk .w,.stk .n{line-height:.708;position:relative;top:-.0615em;font-weight:700;white-space:nowrap}
.stk .m,.stk .w{font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.stk .n{font-size:68px;text-shadow:2px 3px 2px rgba(0,0,0,.2)}
.stk.sat{color:var(--stk-blue)}
.stk.red{color:var(--stk-red)}
.side{flex:1;min-width:0;display:flex;flex-direction:column}
.big{display:flex;align-items:baseline;gap:4px;margin-top:2px}
.big b{font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.big span{font-size:12px;color:var(--mut)}
.segs{display:flex;gap:2px;margin:auto 0 1px;padding-top:10px}
.segs i{flex:1;height:7px;background:var(--faint);position:relative;overflow:hidden;border-radius:1px}
.segs i b{position:absolute;inset:0;background:var(--mut);transform-origin:left;transform:scaleX(0)}
.sub{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.sub.ok{color:var(--ink);font-weight:600}
.side .pn{margin-top:8px}
.col{max-width:356px;margin:0 auto}
.sheet{border-top:1.5px solid var(--ink);padding-top:4px}
.pg{--lh:32px;display:block;width:100%;overflow:hidden;font-size:16px;line-height:var(--lh);padding:0 2px;min-height:calc(var(--lh)*14);
  background-image:linear-gradient(var(--ink),var(--ink)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--faint) calc(var(--lh) - 1px),var(--faint) var(--lh));
  background-size:100% 1.5px,100% var(--lh);background-position:0 var(--gy,447px),0 0;background-repeat:no-repeat,repeat;background-attachment:local,local}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.seal{border:1px solid var(--faint);background:var(--soft);padding:18px 16px;margin-top:4px}
.seal h2{margin:2px 0 2px;font-size:17px;font-weight:600}
.seal .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.txt{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;margin-top:12px;padding-top:12px;border-top:1px solid var(--faint)}
/* month */
.stat{display:grid;grid-template-columns:repeat(7,1fr);padding:2px 0 12px}
.stat>div{text-align:center;min-width:0}
.stat b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:9px;letter-spacing:.1em;color:var(--mut);white-space:nowrap}
.mg{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--ink)}
.dw{font-size:8px;letter-spacing:.14em;color:var(--mut);text-align:center;padding:6px 0 4px;border-bottom:1px solid var(--faint)}
.dw.sat{color:var(--blue)}.dw.sun{color:var(--red)}
.mc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1/1.05;border-bottom:1px solid var(--faint);min-width:0}
.mc b{font-size:12px;font-weight:600;line-height:1;min-width:20px;height:20px;display:inline-grid;place-items:center}
.mc.sat b{color:var(--blue)}.mc.red b{color:var(--red)}
.mc.out{visibility:hidden}
.mc.tod b{background:var(--ink);color:var(--paper);border-radius:50%}
.mc.sel{background:var(--soft)}
.mc:disabled{opacity:.35}
.mk{width:8px;height:8px;border-radius:50%;border:1px solid var(--faint)}
.mk.h{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);border-color:var(--ink)}
.mk.f{background:var(--ink);border-color:var(--ink)}
.leg{display:flex;gap:14px;font-size:10px;color:var(--mut);padding:10px 0;align-items:center}
.leg .mk{display:inline-block;margin-right:5px;vertical-align:-1px}
/* insight */
.ir{display:grid;grid-template-columns:46px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--faint);align-items:start}
.ir.first{border-top:1px solid var(--ink)}
.ir .d b{display:block;font-size:17px;font-weight:600;line-height:1}
.ir .d span{font-size:8px;letter-spacing:.12em;color:var(--mut)}
.ir .d.sat b{color:var(--blue)}.ir .d.red b{color:var(--red)}
.ir .chips{padding:0}
.ir .m{font-size:10.5px;color:var(--mut);text-align:right;line-height:1.5;white-space:nowrap;font-variant-numeric:tabular-nums}
.cmp{padding:12px 0;border-top:1px solid var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.two small{display:block;font-size:10px;color:var(--mut)}
.two > div{min-width:0}
.sec{margin:20px 0 6px}
.chip.yb{background:none}
.chip.yb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mpk{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:2px 0 10px}
.mb{border:1px solid var(--faint);border-radius:8px;padding:7px 0 6px;text-align:center;font-size:12px;line-height:1.25;min-width:0}
.mb small{display:block;font-size:9px;color:var(--mut)}
.mb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mb.on small{color:inherit;opacity:.75}
.mb:disabled{opacity:.3}
/* setting */
.set{padding:12px 0;border-top:1px solid var(--faint)}
.set p{margin:2px 0 8px;color:var(--mut);font-size:11.5px}
.fld{border-bottom:1px solid var(--ink);padding:6px 0;font-size:16px;font-weight:500}
.gr{display:flex;gap:8px;flex-wrap:wrap}
.nrow{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.nrow label{display:block}
.nu{width:64px;text-align:center;font-size:24px;font-weight:600;border-bottom:1.5px solid var(--ink);padding:2px 0;font-variant-numeric:tabular-nums}
.err{color:var(--red)}
.demo{border:1px dashed var(--mut);padding:10px 12px;margin:0 0 12px;font-size:11.5px;color:var(--mut);display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo span{min-width:0}
.cpin{display:block;border:1px solid var(--faint);padding:8px 10px;font-size:16px;line-height:1.5;margin-top:8px;resize:vertical}
/* wide: calendar on the left, page on the right */
@media(min-width:760px) and (orientation:landscape){#app{max-width:1120px}}
/* 가로모드: 세로용 356px 제한은 풀되, 칸이 너무 커지지 않도록 520px에서 멈춘다. 숫자만 바꾸면 폭이 조절된다. */
@media(orientation:landscape){.col{max-width:520px}}
#app.wide #tabs [data-t="month"]{display:none}
/* 가로모드: 탭 사이 틈의 중앙이 두 칸을 나누는 세로선(왼쪽 칸 오른쪽 끝 360px)과 정확히 만나도록 첫 탭 폭을 왼쪽 칸에 맞춘다. 14(바깥 여백)+344+1.5(틈 절반)=359.5 */
#app.wide #tabs{display:grid;grid-template-columns:344px 1fr 1fr;align-items:start}
#view.split{overflow:hidden;padding:0;display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#view.split .pl,#view.split .pr{overflow-y:auto;overflow-x:hidden;min-height:0;padding:4px 18px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#view.split .pl{border-right:1px solid var(--faint)}
</style></head><body>



<div id="app">
  <header id="hd">
    <div class="t">Morning Pages</div>
    <div id="ring" title="저장 상태"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle class="o" cx="12" cy="12" r="9" stroke-dasharray="2 2.6"/><path d="M8.5 12.5l2.4 2.4 4.6-5"/></svg></div>
  </header>
  <main id="view"></main>

    <button data-a="tab" data-t="today">Today</button>

    <button data-a="tab" data-t="setting">Setting</button>
  </nav>
</div>
<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return ymd(d)};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const tdy=()=>ymd(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>Number(n).toLocaleString('ko-KR');
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SHORT=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const HF={'01-01':'신정','03-01':'삼일절','05-05':'어린이날','06-06':'현충일','08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'성탄절'};
const H26={'2026-02-16':1,'2026-02-17':1,'2026-02-18':1,'2026-03-02':1,'2026-05-24':1,'2026-05-25':1,'2026-06-03':1,'2026-08-17':1,'2026-09-24':1,'2026-09-25':1,'2026-09-26':1,'2026-10-05':1,
'2027-02-06':1,'2027-02-07':1,'2027-02-08':1,'2027-02-09':1,'2027-05-01':1,'2027-05-03':1,'2027-05-13':1,'2027-07-17':1,'2027-07-19':1,'2027-08-16':1,'2027-09-14':1,'2027-09-15':1,'2027-09-16':1,'2027-10-04':1,'2027-10-11':1,'2027-12-27':1};
const hol=k=>!!(H26[k]||HF[k.slice(5)]);
const LH=32;
/* ---------- storage ---------- */
const KEY='mp.v1',SYK='mp.sy',DDK='mp.dd';
const mem={};
const ls={g(k){try{const v=localStorage.getItem(k);if(v!=null)return v}catch(e){}return mem[k]==null?null:mem[k]},s(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const jp=(s,d)=>{try{return s?JSON.parse(s):d}catch(e){return d}};
let M=Object.assign({days:{},cfg:{},loc:{}},jp(ls.g(KEY),{}));
M.cfg=Object.assign({ll:25,ln:14,ts:0},M.cfg);
M.loc=Object.assign({theme:'auto',peek:false},M.loc);
if(!M.days||typeof M.days!=='object')M.days={};
let SY=Object.assign({repo:'',token:'',last:0,shas:{},pushed:{},dshas:{}},jp(ls.g(SYK),{}));
let DD=jp(ls.g(DDK),{});
const S={tab:'today',date:tdy(),mon:tdy().slice(0,8)+'01',kx:null,show:null,hasAI:false,dead:false,msg:'',syf:{repo:'',token:''},wide:false,demo:false,gl:0,cp:null,cpMsg:'',ik:null};
let pst=null;
function persist(){clearTimeout(pst);ls.s(KEY,JSON.stringify(M))}
function saveSoon(){clearTimeout(pst);pst=setTimeout(persist,250)}
const saveSY=()=>ls.s(SYK,JSON.stringify(SY));
function ping(){const r=$('#ring');if(!r)return;r.classList.remove('ping');void r.offsetWidth;r.classList.add('ping')}
function save(){saveSoon();ping();syncSoon()}
/* ---------- model ---------- */
const target=()=>M.cfg.ll*M.cfg.ln;
const cnt=t=>Array.from(String(t||'').replace(/[\r\n]/g,'')).length;
const gd=k=>M.days[k]||null;
const wd=k=>M.days[k]||(M.days[k]={t:'',c:0,k:[],ks:'',sealed:false,hd:0,ts:0,kh:''});
const isRed=k=>{const d=gd(k);if(d&&d.hd===1)return true;if(d&&d.hd===-1)return false;return P(k).getDay()===0||hol(k)};
const dcls=k=>isRed(k)?'red':(P(k).getDay()===6?'sat':'');
function togHol(k){const auto=P(k).getDay()===0||hol(k),want=!isRed(k),d=wd(k);d.hd=(want===auto)?0:(want?1:-1);d.ts=Date.now();save();render()}
const hashTxt=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return (h>>>0).toString(36)+'.'+t.length};
function streak(){const dn=x=>{const d=gd(x);return !!d&&d.c>=target()};let k=tdy();if(!dn(k))k=add(k,-1);let n=0;while(dn(k)){n++;k=add(k,-1)}return n}
function autoSeal(){const t=tdy();let ch=false;Object.keys(M.days).forEach(k=>{const d=M.days[k];if(k<t&&d.c>0&&!d.sealed){d.sealed=true;if(!d.k.length){d.k=localKw(d.t);d.ks='local';d.kh=hashTxt(d.t)}d.ts=Date.now();ch=true}});if(ch){persist();syncSoon()}}
/* ---------- keywords ---------- */
const STOP=new Set('오늘 어제 내일 아침 진짜 정말 너무 그냥 일단 하지만 그리고 그래서 그런데 근데 이제 아직 다시 계속 조금 많이 같다 같은 있다 없다 있는 없는 하다 했다 한다 생각 느낌 뭔가 어떻게 그래도 그러면 이렇게 저렇게 그렇게 우리 나는 내가 저는 제가 때문 지금 해서 해야 하는 하면 되는 된다 됐다 이런 저런 그런 어떤 모든 하나 우선 바로 역시 아마 사실 결국 먼저 나중'.split(' '));
const JOSA=/(에서는|으로는|에게는|이라는|에서도|으로도|에서|으로|에게|한테|까지|부터|처럼|보다|이랑|이나|이라|에는|에도|라는|은|는|이|가|을|를|의|에|로|와|과|도|만|랑|나)$/;
const VEND=/(했다|한다|하는|했는데|했던|했고|해서|해야|하고|하게|하면|하지|하며|되는|된다|됐다|있는|없는|싶은|싶다|같은|같다|이며|이다|입니다|인데|지만|니까|으면|면서|는데|다고|라고|네요|어요|아요|예요|이에요|겠다)$/;
/* 조사가 붙어 있던 낱말은 명사일 가능성이 높고, 동사·형용사 어미로 끝나는 낱말은 버린다. 형태소 분석이 아니라 어림짐작이라 Claude보다 거칠다. */
function localKw(text){
  const m=String(text||'').match(/[가-힣]{2,}|[A-Za-z]{3,}/g)||[],f={},nn={};
  m.forEach(w=>{
    let stem=w,hit=0;
    if(/[가-힣]/.test(w)){
      const s=w.replace(JOSA,'');
      if(s!==w&&s.length>=2){stem=s;hit=1}
      else if(VEND.test(w)||(w.length>=3&&/[다요죠까네고며서니면지만데]$/.test(w)))return;
    }
    if(STOP.has(stem))return;
    f[stem]=(f[stem]||0)+1;if(hit)nn[stem]=1;
  });
  const score=w=>(nn[w]?2:0)+f[w]+w.length*.2;
  return Object.keys(f).filter(w=>nn[w]||f[w]>=2||w.length>=3).sort((a,b)=>score(b)-score(a)).slice(0,5);
}
function cleanKw(r){if(!Array.isArray(r))return[];const o=[];r.forEach(x=>{const s=String(x).replace(/["'\[\]{}.,!?]/g,'').trim();if(s&&s.length<=14&&o.indexOf(s)<0)o.push(s)});return o.slice(0,5)}

function cmp(rows,key,label,unit){

function applyKw(raw){

  if(a>=0&&b>a){try{o=JSON.parse(raw.slice(a,b+1))}catch(e){}}
  if(!o||typeof o!=='object'||Array.isArray(o))return {err:'답변에서 키워드 묶음을 찾지 못했어요. Claude의 답변을 그대로 붙여넣어 주세요.'};
  let ok=0,skip=0;
  Object.keys(o).forEach(k=>{const d=gd(k),ks=cleanKw(o[k]);if(d&&d.c>0&&ks.length){d.k=ks;d.ks='ai';d.kh=hashTxt(d.t);d.ts=Date.now();ok++}else skip++});

function demoRows(){
  const out=[];let s=7;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
  const LOW=['피곤','걱정','마감','잡생각','졸림'],HIGH=['산책','감사','계획','기대','맑음'],MID=['커피','가족','책','점심','정리','날씨'],ACT=['개운','가벼움'];
  const pick=(a,n)=>{const c=a.slice(),o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(r()*c.length),1)[0]);return o};
  for(let i=1;i<=24;i++){
    const k=add(tdy(),-i),sl=Math.round(52+r()*44),ex=Math.round(r()<.35?0:10+r()*60),mv=Math.round(180+ex*6+r()*160);
    let kw=[];
    if(sl<70)kw=kw.concat(pick(LOW,2));else if(sl>=84)kw=kw.concat(pick(HIGH,2));
    if(ex>=40)kw=kw.concat(pick(ACT,1));else if(ex===0&&r()<.6)kw.push('피곤');
    kw=kw.concat(pick(MID,1+Math.floor(r()*2)));
    out.push({k:k,kw:kw.filter((w,j)=>kw.indexOf(w)===j).slice(0,5),sl:sl,ex:ex,mv:mv});
  }
  return out.reverse();
}

  h+='</div>';

  h+='<div class="set"><span class="lb">지난 글 열람</span><p>기본값은 잠금이에요. 허용하면 봉인된 글에서 “본문 보기”가 나타나요.</p><button class="btn sm" data-a="peek">'+(M.loc.peek?'다시 잠그기':'열람 허용')+'</button></div>';

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const inViewer=()=>!!(window.claude&&window.claude.use);
const b64u=s=>{const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
async function gh(method,path,body,accept){return fetch('https://api.github.com'+path,{method:method,cache:'no-store',headers:Object.assign({Authorization:'Bearer '+SY.token,Accept:accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined})}
function need(r){if(!r.ok){const e=new Error('http'+r.status);e.status=r.status;throw e}return r}
function sm(t){S.msg=t;const e=$('#syncmsg');if(e)e.textContent=SY.repo&&SY.token?syncStatus():t}
const shardOf=k=>k==='s'?'morning/misc.json':'morning/'+k.slice(2,9)+'.json';
const localTs=k=>k==='s'?M.cfg.ts:((M.days[k.slice(2)]||{}).ts||0);
function applyUnit(k,x){
  if(k==='s'){const v=x.v||{};M.cfg.ll=+v.ll||25;M.cfg.ln=+v.ln||14;M.cfg.ts=x.t}
  else M.days[k.slice(2)]=Object.assign({t:'',c:0,k:[],ks:'',sealed:false,hd:0,kh:''},x.v,{ts:x.t});
}
let syBusy=false,syT=null;
async function doSync(retry){
  persist();sm('동기화 중…');
  const R='/repos/'+SY.repo;
  let r=need(await gh('GET',R));const info=await r.json();
  if(!info.private)throw new Error('PUBLIC');
  const br=info.default_branch||'main',files={};
  r=await gh('GET',R+'/git/trees/'+encodeURIComponent(br)+'?recursive=1');
  if(r.status!==409&&r.status!==404){need(r);((await r.json()).tree||[]).forEach(x=>{if(x.type==='blob')files[x.path]=x.sha})}
  let changed=false;
  for(const p of Object.keys(files).filter(p=>/^morning\/(\d{4}-\d{2}|misc)\.json$/.test(p))){
    if(files[p]===SY.shas[p])continue;
    const rr=need(await gh('GET',R+'/contents/'+p+'?ref='+encodeURIComponent(br),null,'application/vnd.github.raw+json'));
    const o=JSON.parse(await rr.text());
    Object.keys(o.u||{}).forEach(k=>{const x=o.u[k],lt=localTs(k);if(!x||!x.v)return;if(!lt||x.t>lt){applyUnit(k,x);SY.pushed[k]=x.t;changed=true}else if(x.t===lt)SY.pushed[k]=lt});
    SY.shas[p]=files[p];
  }
  const dirty={};
  Object.keys(M.days).forEach(k=>{const d=M.days[k];if(d.ts&&SY.pushed['d:'+k]!==d.ts)dirty['morning/'+k.slice(0,7)+'.json']=1});
  if(M.cfg.ts&&SY.pushed.s!==M.cfg.ts)dirty['morning/misc.json']=1;
  for(const p of Object.keys(dirty)){
    const o={v:1,u:{}},cap={};
    if(p==='morning/misc.json'){if(M.cfg.ts){o.u.s={t:M.cfg.ts,v:{ll:M.cfg.ll,ln:M.cfg.ln}};cap.s=M.cfg.ts}}
    else Object.keys(M.days).forEach(k=>{const d=M.days[k];if(d.ts&&'morning/'+k.slice(0,7)+'.json'===p){const v=Object.assign({},d);delete v.ts;o.u['d:'+k]={t:d.ts,v:v};cap['d:'+k]=d.ts}});
    const body={message:'morning '+new Date().toISOString(),content:b64u(JSON.stringify(o))};if(files[p])body.sha=files[p];
    const res=await gh('PUT',R+'/contents/'+p,body);
    if((res.status===409||res.status===422)&&retry<2){saveSY();return doSync(retry+1)}
    need(res);const j=await res.json();files[p]=j.content.sha;SY.shas[p]=j.content.sha;
    Object.keys(cap).forEach(k=>{SY.pushed[k]=cap[k]});
    saveSY();await sleep(300);
  }
  let ddch=false;
  for(const p of Object.keys(files).filter(p=>/^days\/\d{4}-\d{2}\.json$/.test(p))){
    if(files[p]===SY.dshas[p])continue;
    const rr=need(await gh('GET',R+'/contents/'+p+'?ref='+encodeURIComponent(br),null,'application/vnd.github.raw+json'));
    const o=JSON.parse(await rr.text());
    Object.keys(o.u||{}).forEach(k=>{const x=o.u[k];if(k.slice(0,2)!=='d:'||!x||x.x||!x.v)return;const v=x.v;DD[k.slice(2)]={slS:v.slS,slH:v.slH,slM:v.slM,ex:v.ex,mv:v.mv,steps:v.steps};ddch=true});
    SY.dshas[p]=files[p];
  }
  if(ddch)ls.s(DDK,JSON.stringify(DD));
  SY.last=Date.now();saveSY();
  if(changed)persist();
  sm('');
  if(changed||ddch){const a=document.activeElement;if(!(a&&a.id==='pg'))render()}
}
function syncErr(e){
  if(e&&e.message==='PUBLIC')return '이 저장소는 공개 상태예요. 일기가 노출되지 않도록 비공개 저장소를 사용해 주세요.';
  const s=e&&e.status;
  if(s===401)return '토큰이 올바르지 않거나 만료됐어요.';
  if(s===403)return '권한이 없거나 요청이 너무 많아요. 토큰의 Contents 읽기·쓰기 권한을 확인해 주세요.';
  if(s===404)return '저장소를 찾을 수 없어요. 이름과, 토큰이 이 저장소에 접근할 수 있는지 확인해 주세요.';
  if(e instanceof TypeError)return inViewer()?'Claude 안에서 연 이 페이지는 GitHub에 직접 연결할 수 없어요. GitHub에 올린 주소로 열면 동기화돼요.':'연결할 수 없어요. 인터넷 상태를 확인해 주세요.';
  return '동기화 중 문제가 생겼어요. 잠시 후 다시 시도해 주세요.';
}
async function syncRun(){if(!SY.repo||!SY.token||syBusy)return;syBusy=true;try{await doSync(0)}catch(e){sm(syncErr(e))}finally{syBusy=false}}

    SY={repo:repo,token:tok,last:0,shas:{},pushed:{},dshas:{}};saveSY();S.syf={repo:'',token:''};S.msg='';render();syncRun();
  },
  syncNow(){syncRun()},
  syncOff(){SY={repo:'',token:'',last:0,shas:{},pushed:{},dshas:{}};saveSY();S.msg='';render()}
};
